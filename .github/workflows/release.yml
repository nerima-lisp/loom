name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Check tag/version alignment before spending time on the release build.
jobs:
  verify:
    name: Verify the tagged tree
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.version.outputs.commit }}
    env:
      RELEASE_REF: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Require a version tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || format('refs/tags/{0}', env.RELEASE_REF) }}
          persist-credentials: false

      - name: Verify tag matches .asd version
        id: version
        env:
          PACKAGE: loom
          EVENT_NAME: ${{ github.event_name }}
          EVENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push ]] && [[ "$(git rev-parse HEAD)" != "$EVENT_COMMIT" ]]; then
            echo "::error::Checkout commit does not match push event commit" >&2
            exit 1
          fi
          asd_version="$(sed -n 's/^[[:space:]]*:version "\([^"]*\)".*/\1/p' "$PACKAGE.asd" | head -n1)"
          tag_version="${RELEASE_REF#v}"
          echo "asd=$asd_version tag=$tag_version"
          if [[ "$asd_version" != "$tag_version" ]]; then
            echo "::error::Tag $RELEASE_REF does not match $PACKAGE.asd version $asd_version" >&2
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  cross-platform-ci:
    name: Cross-platform CI (Linux and aarch64-darwin)
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      platforms: all
      checkout_ref: ${{ needs.verify.outputs.commit }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  release:
    name: build and publish x86_64-linux
    needs: [verify, cross-platform-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_REF: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-loom' }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build release binary
        run: nix build --print-build-logs

      # Release validation needs a real PTY, so this runs outside the Nix sandbox.
      - name: Run PTY E2E
        run: nix run .#e2e

      - name: Package tarball + checksum
        run: |
          set -euo pipefail
          name="loom-${RELEASE_REF}-x86_64-linux"
          bash scripts/package-release.sh result "$name" dist
          # The runner restricts unprivileged mounts; keep the restored store isolated.
          sudo env "PATH=$(dirname "$(command -v nix)"):/usr/bin:/bin" \
            bash scripts/test-release.sh "dist/${name}.tar.gz" "${RELEASE_REF#v}"

      - name: Verify the release tag has not moved
        env:
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail
          tag_refs="$(git ls-remote origin "refs/tags/$RELEASE_REF" "refs/tags/$RELEASE_REF^{}")"
          tag_commit="$(printf '%s\n' "$tag_refs" | awk '$2 ~ /\^\{\}$/ { print $1 }')"
          if [[ -z "$tag_commit" ]]; then
            tag_commit="$(printf '%s\n' "$tag_refs" | awk 'NF == 2 { print $1 }')"
          fi
          [[ "$tag_commit" == "$VERIFIED_COMMIT" ]]

      # Leave the release as draft until a maintainer supplies the canonical notes.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          releases="$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name')"
          if grep -Fxq "$RELEASE_REF" <<< "$releases"; then
            echo "::error::A release already exists for $RELEASE_REF; refusing to replace it." >&2
            exit 1
          fi
          name="loom-${RELEASE_REF}-x86_64-linux"
          gh release create "$RELEASE_REF" "dist/$name.tar.gz" "dist/$name.tar.gz.sha256" \
            --draft --verify-tag --title "$RELEASE_REF" --notes ""
