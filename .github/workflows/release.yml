name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Check tag/version alignment before spending time on the release build.
jobs:
  verify:
    name: Verify the tagged tree
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.version.outputs.commit }}
    env:
      RELEASE_REF: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Require a version tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Verify tag matches .asd version
        id: version
        env:
          PACKAGE: loom
        run: |
          set -euo pipefail
          asd_version="$(sed -n 's/^[[:space:]]*:version "\([^"]*\)".*/\1/p' "$PACKAGE.asd" | head -n1)"
          tag_version="${RELEASE_REF#v}"
          echo "asd=$asd_version tag=$tag_version"
          if [[ "$asd_version" != "$tag_version" ]]; then
            echo "::error::Tag $RELEASE_REF does not match $PACKAGE.asd version $asd_version" >&2
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-loom' }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Test release archive input validation
        run: python3 -B t/release/test-archives.py -v

  release:
    name: build and publish x86_64-linux
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_REF: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-loom' }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build release binary
        run: nix build --print-build-logs

      # Release validation needs a real PTY, so this runs outside the Nix sandbox.
      - name: Run PTY E2E
        run: nix run .#e2e

      - name: Package tarball + checksum
        run: |
          set -euo pipefail
          name="loom-${RELEASE_REF}-x86_64-linux"
          bash scripts/package-release.sh result "$name" dist
          # The runner restricts unprivileged mounts; keep the restored store isolated.
          sudo env "PATH=$(dirname "$(command -v nix)"):/usr/bin:/bin" \
            bash scripts/test-release.sh "dist/${name}.tar.gz"

      - name: Verify the release tag has not moved
        env:
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail
          tag_refs="$(git ls-remote origin "refs/tags/$RELEASE_REF" "refs/tags/$RELEASE_REF^{}")"
          tag_commit="$(printf '%s\n' "$tag_refs" | awk '$2 ~ /\^\{\}$/ { print $1 }')"
          if [[ -z "$tag_commit" ]]; then
            tag_commit="$(printf '%s\n' "$tag_refs" | awk 'NF == 2 { print $1 }')"
          fi
          [[ "$tag_commit" == "$VERIFIED_COMMIT" ]]

      # Leave the release as draft until a maintainer supplies the canonical notes.
      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_REF }}
          draft: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
