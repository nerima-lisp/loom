name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e_scenario:
        description: Run one PTY E2E scenario
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs run repository code without a write-capable checkout token.
jobs:
  check:
    name: nix flake check
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e_scenario == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-loom' }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Test release archive input validation
        run: python3 -B t/release/test-archives.py -v

      - name: Test release workflow guards
        run: python3 -B t/release/test-workflow.py -v

      - name: Check flake
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 1800s \
            nix flake check --print-build-logs 2>&1 | tee "$RUNNER_TEMP/loom-flake-check.log"

      - name: Publish coverage baseline
        if: ${{ always() }}
        run: |
          set -euo pipefail
          summary_lines="$(grep -E 'COVERAGE-(EXPRESSIONS|BRANCHES) ' "$RUNNER_TEMP/loom-flake-check.log" || true)"
          if [[ -n "$summary_lines" ]]; then
            {
              echo '### Coverage baseline'
              echo
              echo '```text'
              printf '%s\n' "$summary_lines"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Coverage baseline was not emitted by the flake check.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check diff hygiene
        run: git diff --check

  e2e:
    name: PTY E2E
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-loom' }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build default package
        run: nix build .#default --print-build-logs

      - name: Run PTY E2E
        env:
          E2E_SCENARIO: ${{ inputs.e2e_scenario || '' }}
        run: |
          if [[ -n "$E2E_SCENARIO" ]]; then
            timeout --signal=TERM --kill-after=15s 600s nix run .#e2e -- --only "$E2E_SCENARIO"
          else
            timeout --signal=TERM --kill-after=15s 600s nix run .#e2e
          fi

  release-archive:
    name: Offline release archive
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e_scenario == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-loom' }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build default package
        run: nix build .#default --print-build-logs

      - name: Package and restore in an empty store
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*:version "\([^"]*\)".*/\1/p' loom.asd | head -n1)"
          bash scripts/package-release.sh result loom-ci-x86_64-linux "$RUNNER_TEMP/dist"
          # The runner restricts unprivileged mounts; keep the restored store isolated.
          sudo env "PATH=$(dirname "$(command -v nix)"):/usr/bin:/bin" \
            bash scripts/test-release.sh "$RUNNER_TEMP/dist/loom-ci-x86_64-linux.tar.gz" "$version"
