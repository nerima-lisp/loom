site_name: loom
site_description: Terminal text editor with Emacs-like keybindings
site_url: https://nerima-lisp.github.io/loom/
repo_url: https://github.com/nerima-lisp/loom
repo_name: nerima-lisp/loom
edit_uri: edit/main/docs/src/
copyright: MIT

docs_dir: src
site_dir: ../site
use_directory_urls: true
strict: true

theme:
  name: material
  language: en
  favicon: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

extra_css:
  - assets/stylesheets/extra.css

# Every page under docs/src/ must appear here: --strict fails the build on an
# unlisted page. That is deliberate, so the nav cannot silently fall behind.
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - Core Concepts: guide/core-concepts.md
  - Reference:
      - API: reference/api.md
      - Architecture: reference/architecture.md
  - Project:
      - Development: project/development.md
      - Roadmap: project/roadmap.md

not_in_nav: |
  notes/
